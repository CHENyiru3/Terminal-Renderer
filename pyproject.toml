[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-renderer"
version = "0.1.0"
description = "Prompt-generated pixel art and interactive scenes for truecolor terminals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
terminal-renderer = "terminal_renderer.cli:main"

[project.urls]
Repository = "https://github.com/CHENyiru3/Terminal-Renderer"
Issues = "https://github.com/CHENyiru3/Terminal-Renderer/issues"

[tool.setuptools]
packages = ["terminal_renderer", "terminal_renderer.examples"]
include-package-data = false

[tool.setuptools.package-dir]
"terminal_renderer.examples" = "examples"

[tool.setuptools.package-data]
"terminal_renderer.examples" = ["*.txt", "*.json"]
